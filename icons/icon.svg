<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="90" fill="url(#g)"/>
  <!-- 鉛筆の形 -->
  <g transform="translate(256,256)">
    <!-- 鉛筆本体 -->
    <rect x="-28" y="-140" width="56" height="200" rx="8" fill="white" opacity="0.95"/>
    <!-- 鉛筆先端 -->
    <polygon points="-28,60 28,60 0,120" fill="#ffd166"/>
    <!-- 鉛筆芯 -->
    <polygon points="-8,100 8,100 0,120" fill="#4a4a4a"/>
    <!-- 消しゴム部分 -->
    <rect x="-28" y="-170" width="56" height="32" rx="6" fill="#ff9aa2"/>
    <!-- 消しゴムライン -->
    <rect x="-28" y="-142" width="56" height="5" fill="rgba(0,0,0,0.15)"/>
    <!-- 鉛筆の縦線 -->
    <rect x="-8" y="-138" width="4" height="196" rx="2" fill="rgba(0,0,0,0.08)"/>
    <rect x="4" y="-138" width="4" height="196" rx="2" fill="rgba(255,255,255,0.3)"/>
  </g>
</svg>
